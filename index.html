<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#061331">
<title>Một bó hoa dành tặng em</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff8fc9;--hotpink:#ed4b9a;--paper:#fff0ca;--night:#04102f;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04102f;color:#fff;font-family:Georgia,'Times New Roman',serif}
button{font:inherit}
#app{position:relative;width:100%;height:100%;height:100dvh;max-width:520px;margin:0 auto;overflow:hidden;background:#04102f;isolation:isolate}
/* The quiet opening screen */
.intro{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 49% 48%,#102858 0%,#0a1b42 39%,#06132f 71%,#040b20 100%);transition:opacity 1s ease,visibility 1s}
.intro:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 80%,#12326433,transparent 50%)}
.intro.exit{opacity:0;visibility:hidden;pointer-events:none}
.hold-control{position:absolute;left:50%;bottom:12%;width:105px;height:105px;transform:translateX(-50%);display:grid;place-items:center;border:0;background:transparent;color:white;cursor:pointer;touch-action:manipulation}
.hold-control .ring{position:absolute;inset:5px;border:1px solid #6cb9f366;border-radius:50%;box-shadow:0 0 20px #49a5f51c,inset 0 0 18px #45a6ff12;animation:ringPulse 2.3s ease-out infinite}
.hold-control .ring:nth-child(2){inset:-7px;animation-delay:.7s}
.hold-control .orb{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#ffd4ef 0 10%,#ff86c9 35%,#db3889 75%,#a81a63 100%);box-shadow:0 0 12px #ff70c4,0 0 35px #f05cab55;transition:transform .25s}
.hold-control.holding .orb{transform:scale(1.28)}
.hold-label{position:absolute;left:0;right:0;bottom:calc(100% + 23px);font-size:12px;letter-spacing:.35px;color:#e1e8fb;white-space:nowrap;text-shadow:0 1px 7px #b8d5ff42}
.hold-control:focus-visible{outline:2px solid #ffadd6;outline-offset:9px;border-radius:50%}
@keyframes ringPulse{0%{transform:scale(.78);opacity:.7}100%{transform:scale(1.2);opacity:0}}
/* Night sky and landscape */
.garden{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#061331 0%,#08234f 27%,#104a86 53%,#102c4c 69%,#061b2c 100%);opacity:0;transition:opacity 1.15s ease}
.garden.active{opacity:1}
.sky-glow{position:absolute;inset:0;background:radial-gradient(ellipse at 51% 54%,#68c4ff36 0%,#176eb433 27%,transparent 57%);pointer-events:none}
.star-field{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#f8fbff;box-shadow:0 0 5px 1px #cceaff70;animation:twinkle var(--duration,3s) ease-in-out infinite alternate;animation-delay:var(--delay,0s);opacity:var(--alpha,.8)}
@keyframes twinkle{0%{opacity:.18;transform:scale(.75)}100%{opacity:1;transform:scale(1.35)}}
.moon{position:absolute;top:6.1%;left:8%;width:17px;height:17px;border-radius:50%;background:#fff3d2;box-shadow:0 0 9px #e6f5ff,0 0 21px #9bd5ff55}
.moon:after{content:"";position:absolute;top:-3px;left:6px;width:17px;height:17px;border-radius:50%;background:#071735}
.shooting-star{position:absolute;left:-13%;top:25%;width:54px;height:1.5px;background:linear-gradient(90deg,transparent,#fff,#bde7ff);transform:rotate(28deg);opacity:0;filter:drop-shadow(0 0 3px #bcecff);animation:shoot 6.8s linear infinite}
.shooting-star.s2{top:44%;left:-17%;animation-delay:3.7s;animation-duration:8.5s}
@keyframes shoot{0%,68%{opacity:0;transform:translate(0,0) rotate(28deg)}70%{opacity:1}79%{opacity:0;transform:translate(150vw,80px) rotate(28deg)}100%{opacity:0}}
.hills{position:absolute;left:-10%;width:120%;bottom:23%;height:22%;pointer-events:none}
.hills svg{width:100%;height:100%;display:block}
.field{position:absolute;bottom:0;left:0;width:100%;height:32%;background:linear-gradient(180deg,#183b4c 0%,#0b2634 34%,#061821 100%);clip-path:polygon(0 11%,8% 16%,18% 8%,28% 15%,38% 6%,49% 13%,62% 9%,72% 15%,84% 7%,100% 12%,100% 100%,0 100%)}
.field-haze{position:absolute;bottom:8%;left:-20%;width:140%;height:22%;background:radial-gradient(ellipse at 50% 20%,#4eafac20,transparent 60%);pointer-events:none}
.grass-line{position:absolute;bottom:-1%;left:0;width:100%;height:34%;pointer-events:none;overflow:hidden}
.grass-line svg{width:100%;height:100%;display:block}
.grass-blade{transform-origin:bottom center;animation:sway var(--sway,4s) ease-in-out infinite alternate;animation-delay:var(--delay,0s)}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2.2deg)}}
.firefly{position:absolute;width:3px;height:3px;border-radius:50%;background:#e3f9ff;box-shadow:0 0 7px 2px #b7e8ff;animation:firefly 3.8s ease-in-out infinite alternate;animation-delay:var(--delay,0s)}
@keyframes firefly{from{opacity:.08;transform:translateY(5px)}to{opacity:.9;transform:translateY(-15px)}}
.headline{position:absolute;top:7.2%;left:5%;right:5%;z-index:2;text-align:center;color:#e6e8ff;font-family:'Purisa','Comic Neue',cursive;font-style:italic;font-weight:600;font-size:clamp(25px,7vw,34px);line-height:1.12;letter-spacing:.3px;text-shadow:0 0 2px #fff,0 0 9px #bddcffbd,0 0 22px #78baff70;opacity:0;transform:translateY(10px);transition:opacity 1.8s,transform 1.8s;pointer-events:none}
.garden.active .headline{opacity:1;transform:translateY(0);transition-delay:.6s}
#app.letter-open .headline{opacity:0;transform:translateY(-8px);transition-delay:0s}
.headline span{display:block}
/* Custom illustrated rose bouquet */
.bouquet-button{position:absolute;z-index:5;left:50%;bottom:7%;width:min(96vw,390px);height:min(64vh,520px);min-height:370px;transform:translateX(-50%);border:0;background:transparent;padding:0;cursor:pointer;opacity:0;pointer-events:none;filter:drop-shadow(0 9px 9px #0005);transition:opacity 1.2s ease;touch-action:manipulation}
.bouquet-button.ready{opacity:1;pointer-events:none}
.bouquet-button.ready.bouquet-complete{pointer-events:auto}
.bouquet-button:not(.ready) .stem,.bouquet-button:not(.ready) .leaf,.bouquet-button:not(.ready) .rose-head,.bouquet-button:not(.ready) .wrap-part,.bouquet-button:not(.ready) .bow,.bouquet-button:not(.ready) .envelope{animation-play-state:paused}
.bouquet-button:focus-visible{outline:2px solid #ffbada;outline-offset:4px;border-radius:36%}
.bouquet-svg{width:100%;height:100%;overflow:visible;display:block}
.stem{stroke:#398551;stroke-width:5;stroke-linecap:round;fill:none;stroke-dasharray:260;stroke-dashoffset:260;animation:stemGrow 1.55s cubic-bezier(.2,.75,.3,1) forwards;animation-delay:var(--d,0s)}
.leaf{transform-box:fill-box;transform-origin:bottom center;opacity:0;animation:leafGrow .65s ease-out forwards;animation-delay:var(--d,1s)}
.rose-head{transform-box:fill-box;transform-origin:50% 75%;opacity:0;transform:scale(.12) rotate(-15deg);animation:rosePop .68s cubic-bezier(.18,.85,.25,1.3) forwards;animation-delay:var(--d,1.4s)}
@keyframes stemGrow{to{stroke-dashoffset:0}}
@keyframes leafGrow{0%{opacity:0;transform:scale(.15) rotate(-25deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes rosePop{to{opacity:1;transform:scale(1) rotate(0)}}
.wrap-part{opacity:0;transform-box:fill-box;transform-origin:center;animation:wrapUp .8s ease-out forwards;animation-delay:4.3s}
@keyframes wrapUp{to{opacity:1;transform:translateY(0)}}
.bouquet-button .wrap-left{transform:translate(-15px,12px);animation-name:wrapLeft}
.bouquet-button .wrap-right{transform:translate(15px,12px);animation-name:wrapRight}
@keyframes wrapLeft{to{opacity:1;transform:translate(0,0)}}@keyframes wrapRight{to{opacity:1;transform:translate(0,0)}}
.bow{opacity:0;animation:rosePop .5s ease-out forwards;animation-delay:5s}
.envelope{opacity:0;transform-box:fill-box;transform-origin:center;transform:translateY(-15px) scale(.8);pointer-events:none;transition:opacity .72s ease,transform .72s cubic-bezier(.2,.8,.2,1)}
.cats{position:absolute;z-index:3;left:0;right:0;bottom:9.5%;height:78px;pointer-events:none;opacity:0;transition:opacity .8s;display:flex;justify-content:space-between;align-items:end;padding:0 8%}
.cats.show{opacity:1;transition-delay:4.9s}
.cat{width:54px;height:65px;filter:drop-shadow(0 4px 4px #020b1777);animation:catNod 3s ease-in-out infinite alternate;transform-origin:bottom center}
.cat:last-child{animation-delay:.8s}
@keyframes catNod{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-4px) rotate(2deg)}}
.tap-hint{position:absolute;z-index:4;bottom:3.1%;left:0;right:0;text-align:center;color:#d9edff9c;font:10px/1.4 Arial,sans-serif;letter-spacing:1.2px;opacity:0;transition:opacity .9s}
.tap-hint.show{opacity:1;transition-delay:5.3s}
/* The bouquet opens, then a handmade cream letter grows and types its message. */
.bouquet-button.opened .rose-head{animation:roseSpread .9s cubic-bezier(.2,.7,.25,1) forwards;animation-delay:0s!important;opacity:1}
.bouquet-button.opened .r1{--dx:-4px;--dy:-2px}.bouquet-button.opened .r2{--dx:-2px;--dy:-5px}.bouquet-button.opened .r3{--dx:0px;--dy:-5px}.bouquet-button.opened .r4{--dx:3px;--dy:-4px}.bouquet-button.opened .r5{--dx:4px;--dy:-2px}
@keyframes roseSpread{to{transform:translate(var(--dx,0),var(--dy,0)) scale(1.04);filter:drop-shadow(0 0 7px #ff8bca)}}
.bouquet-button.envelope-ready:not(.envelope-hidden) .envelope{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.bouquet-button.envelope-hidden .envelope{opacity:0!important;transform:translateY(10px) scale(.82);transition:opacity .4s ease,transform .55s ease;pointer-events:none}
.bouquet-button.envelope-hidden .envelope .env-flap{transform:rotateX(170deg) translateY(-3px);fill:#ffd9e8}
.env-flap{transform-box:fill-box;transform-origin:50% 0%;transition:transform .62s cubic-bezier(.2,.75,.25,1),fill .3s;backface-visibility:visible}
.bouquet-button.envelope-hidden .envelope .heart-seal{opacity:0;transition:opacity .2s}
.letter-overlay{position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;padding:5.5% 5% 4%;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .35s ease,visibility .35s}
.letter-overlay.visible{opacity:1;visibility:visible;pointer-events:auto}
.letter-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,9,30,.12),rgba(2,9,30,.25));backdrop-filter:blur(1.2px);opacity:0;transition:opacity .55s}
.letter-overlay.visible .letter-shade{opacity:1}
.letter-card{position:relative;z-index:1;width:100%;max-width:440px;max-height:68%;overflow:auto;overscroll-behavior:contain;padding:29px 25px 24px;background:#f56ea8;color:#6b514b;border:0;box-shadow:0 6px 0 #c93679,0 13px 34px #02081975;clip-path:polygon(2% 2%,8% .7%,16% 1.6%,25% .5%,34% 1.6%,44% .5%,55% 1.6%,66% .6%,77% 1.6%,88% .5%,98% 1.8%,99.5% 10%,98.5% 22%,100% 36%,98.8% 50%,100% 66%,98.7% 81%,99.5% 97%,90% 99.5%,79% 98.5%,68% 100%,57% 98.7%,45% 100%,33% 98.7%,21% 99.6%,10% 98.5%,1% 99.5%,2% 86%,.5% 72%,1.7% 58%,.5% 43%,1.8% 29%,.7% 15%);transform:translateY(15px) scale(.965);opacity:0;transition:transform .55s cubic-bezier(.18,.8,.2,1),opacity .4s;isolation:isolate}
.letter-card:before{content:"";position:absolute;z-index:0;inset:4px;background:linear-gradient(145deg,#fff5d9 0%,#ffefd0 65%,#ffebca 100%);clip-path:polygon(2% 2%,8% .7%,16% 1.6%,25% .5%,34% 1.6%,44% .5%,55% 1.6%,66% .6%,77% 1.6%,88% .5%,98% 1.8%,99.5% 10%,98.5% 22%,100% 36%,98.8% 50%,100% 66%,98.7% 81%,99.5% 97%,90% 99.5%,79% 98.5%,68% 100%,57% 98.7%,45% 100%,33% 98.7%,21% 99.6%,10% 98.5%,1% 99.5%,2% 86%,.5% 72%,1.7% 58%,.5% 43%,1.8% 29%,.7% 15%);pointer-events:none;opacity:.99}
.letter-card:after{content:"";position:absolute;z-index:0;left:12%;right:12%;bottom:-3px;height:5px;background:#ffe1bd;border-radius:50%;filter:blur(3px)}
.letter-title,.letter-body,.letter-sign,.letter-next{position:relative;z-index:1}
.letter-overlay.visible .letter-card{transform:translateY(0) scale(1);opacity:1;transition-delay:.18s}
.letter-title{margin:0 24px 17px;text-align:center;color:#bd386a;font-family:"Dancing Script","URW Chancery L","Brush Script MT",cursive,Georgia,serif;font-style:italic;font-weight:600;font-size:clamp(21px,5.8vw,29px);line-height:1.22;text-shadow:0 1px #fff7e8;letter-spacing:.1px}
.letter-body{font-family:"Dancing Script","URW Chancery L","Brush Script MT",cursive,Georgia,serif;font-size:clamp(16px,4.2vw,20px);font-style:italic;line-height:1.72;white-space:pre-wrap;overflow-wrap:anywhere;color:#66514a;min-height:46px;text-align:left;letter-spacing:.05px}
.letter-body .caret{display:inline-block;width:1.5px;height:1.02em;margin-left:2px;vertical-align:-.12em;background:#bd386a;animation:caretBlink .75s steps(1,end) infinite}
@keyframes caretBlink{50%{opacity:0}}
.letter-sign{margin:13px 0 0;text-align:right;font-family:"Dancing Script","URW Chancery L","Brush Script MT",cursive,Georgia,serif;font-size:clamp(17px,4.4vw,21px);font-style:italic;color:#ba3e76;opacity:0;transform:translateY(8px);transition:opacity .7s,transform .7s}
.letter-sign.show{opacity:1;transform:translateY(0)}
.letter-next{display:block;margin:15px auto 0;padding:9px 25px;border:0;border-radius:25px;background:linear-gradient(100deg,#e94e8e,#c91f67);color:white;font:600 13px Arial,sans-serif;box-shadow:0 4px 9px #c92b6a4d;opacity:0;pointer-events:none;transform:translateY(6px);transition:opacity .5s,transform .5s}
.letter-next.show{opacity:1;pointer-events:auto;transform:translateY(0)}
.letter-close{position:absolute;z-index:12;top:8px;right:8px;width:31px;height:31px;border:1.5px solid #fff9f0;border-radius:50%;background:#d92569;color:#fff;box-shadow:0 2px 8px #a8245844;font:23px/1 Arial,sans-serif;display:grid;place-items:center;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .35s}
.letter-overlay.visible .letter-close{opacity:1;pointer-events:auto;transition-delay:.35s}
@media(max-height:690px){.bouquet-button{height:60vh;min-height:315px;bottom:6%}.headline{top:4.5%;font-size:clamp(21px,6vw,29px)}.letter-card{max-height:60%;padding:22px 18px 18px}.letter-title{margin-bottom:12px}.letter-body{font-size:13px;line-height:1.58}}
@media(min-width:520px){.hold-control{bottom:13%}.bouquet-button{width:380px}.headline{font-size:34px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}

</style>
</head>
<body>
<main id="app" aria-label="Món quà dành tặng em">
  <section class="intro" id="intro" aria-label="Màn hình mở đầu">
    <button class="hold-control" id="holdControl" type="button" aria-label="Ấn giữ để mở quà">
      <span class="ring"></span><span class="ring"></span><span class="orb"></span>
      <span class="hold-label">Ấn giữ để mở quà</span>
    </button>
  </section>

  <section class="garden" id="garden" aria-label="Bầu trời đêm và bó hoa">
    <div class="sky-glow"></div>
    <div class="star-field" id="stars"></div>
    <div class="moon"></div><div class="shooting-star"></div><div class="shooting-star s2"></div>
    <div class="headline"><span>Happy Vietnamese</span><span>Women's Day</span><span>20/10</span></div>
    <div class="hills" aria-hidden="true">
      <svg viewBox="0 0 500 170" preserveAspectRatio="none">
        <defs><linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#234c80"/><stop offset="1" stop-color="#102d4f"/></linearGradient><linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#3a719a"/><stop offset="1" stop-color="#173c60"/></linearGradient></defs>
        <path d="M0 102 L42 87 67 91 108 59 145 83 194 46 229 80 264 65 296 89 345 39 390 82 426 58 465 81 500 68 500 170 0 170Z" fill="url(#hillBack)"/>
        <path d="M0 115 L52 103 88 111 127 93 166 109 205 84 253 112 298 92 340 109 382 78 415 104 454 90 500 110 500 170 0 170Z" fill="url(#hillFront)" opacity=".93"/>
        <path d="M0 124 Q90 112 155 124 T302 119 T500 121" fill="none" stroke="#9edcff" stroke-opacity=".23" stroke-width="2"/>
      </svg>
    </div>
    <div class="field"></div><div class="field-haze"></div>
    <div class="grass-line" aria-hidden="true"><svg id="grassSvg" viewBox="0 0 500 260" preserveAspectRatio="none"></svg></div>
    <div id="fireflies"></div>

    <button class="bouquet-button" id="bouquet" type="button" aria-label="Chạm vào bó hoa hồng để mở lời chúc">
      <svg class="bouquet-svg" viewBox="0 0 360 470" role="img" aria-label="Bó hoa hồng hồng được gói giấy màu kem">
        <defs>
          <linearGradient id="stemGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#74b86b"/><stop offset=".48" stop-color="#32834d"/><stop offset="1" stop-color="#1e543d"/></linearGradient>
          <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a3d66a"/><stop offset=".4" stop-color="#478d4e"/><stop offset="1" stop-color="#1b5a45"/></linearGradient>
          <linearGradient id="paperGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7d49a"/><stop offset=".22" stop-color="#dca86f"/><stop offset=".43" stop-color="#f6d8a1"/><stop offset=".68" stop-color="#e5b879"/><stop offset="1" stop-color="#b88050"/></linearGradient>
          <linearGradient id="paperShade" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ac7347"/><stop offset=".42" stop-color="#eac38b"/><stop offset="1" stop-color="#ffebc6"/></linearGradient>
          <pattern id="kraftTexture" width="23" height="25" patternUnits="userSpaceOnUse"><path d="M2 4 l6 1 M14 9 l6 -1 M5 19 l8 1 M17 23 l4 -2 M10 13 l3 .5" fill="none" stroke="#895b35" stroke-width=".8" opacity=".25"/><path d="M11 2 l1 4 M21 14 l-2 4 M2 12 l2 3 M14 20 l1 3" fill="none" stroke="#fff5d9" stroke-width=".85" opacity=".45"/><circle cx="19" cy="5" r=".8" fill="#875b38" opacity=".2"/></pattern>
          <linearGradient id="ribbonGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb4d5"/><stop offset=".5" stop-color="#f070ad"/><stop offset="1" stop-color="#c83d82"/></linearGradient>
          <radialGradient id="petalOuter" cx="35%" cy="20%" r="85%"><stop stop-color="#ffcbe6"/><stop offset=".36" stop-color="#ff83bf"/><stop offset=".75" stop-color="#f34e9c"/><stop offset="1" stop-color="#b92e70"/></radialGradient>
          <linearGradient id="petalMid" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fff0f8"/><stop offset=".28" stop-color="#ffacd5"/><stop offset=".73" stop-color="#f24b99"/><stop offset="1" stop-color="#bb286d"/></linearGradient>
          <radialGradient id="petalLight" cx="28%" cy="22%" r="80%"><stop stop-color="#fff0fa"/><stop offset=".3" stop-color="#ffadd7"/><stop offset=".8" stop-color="#ee4c98"/><stop offset="1" stop-color="#c42d71"/></radialGradient>
          <linearGradient id="envelopeGrad" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff2f7"/><stop offset="1" stop-color="#f6b6d1"/></linearGradient>
          <g id="leafShape"><path d="M0 0 C-17 -25 -39 -32 -45 -14 C-37 3 -15 10 0 0Z" fill="url(#leafGrad)" stroke="#276b45" stroke-width="1.1"/><path d="M-2 -1 Q-23 -14 -40 -15" fill="none" stroke="#d1ed91" stroke-opacity=".75" stroke-width="1.1"/></g>
          <g id="roseBloom">
            <!-- Full, soft pink rose with overlapping petal layers -->
            <path d="M-25 12 C-37 4 -35 -15 -24 -25 C-18 -34 -6 -35 1 -27 C10 -38 25 -31 29 -18 C39 -4 32 15 19 27 C9 37 -9 36 -20 27 C-25 23 -27 18 -25 12Z" fill="url(#petalOuter)" stroke="#c33274" stroke-width="1.3"/>
            <path d="M-25 1 C-29 -9 -22 -22 -12 -23 C-5 -31 6 -28 12 -19 C20 -27 29 -17 27 -6 C35 6 22 21 10 22 C-4 28 -21 18 -25 1Z" fill="#f56fac" stroke="#e3488e" stroke-width="1.05"/>
            <path d="M-20 4 C-26 -7 -16 -20 -5 -19 C2 -25 13 -19 14 -10 C23 -8 24 4 16 13 C7 22 -10 20 -20 4Z" fill="url(#petalMid)" stroke="#d83a7f" stroke-width="1.05"/>
            <path d="M-15 1 C-18 -8 -7 -17 1 -12 C9 -19 20 -10 17 -1 C22 7 11 17 2 15 C-7 19 -17 11 -15 1Z" fill="url(#petalLight)" stroke="#d83a7f" stroke-width=".95"/>
            <path d="M-9 0 C-12 -7 -3 -12 4 -9 C11 -9 14 -1 8 6 C4 12 -6 10 -8 4 C-12 2 -11 -2 -9 0Z" fill="#f965a6" stroke="#d33a7b" stroke-width=".9"/>
            <path d="M-4 -1 C-1 -6 7 -5 8 0 C8 4 4 7 0 5 C-3 4 -2 1 1 0" fill="none" stroke="#c23270" stroke-width="1.25" stroke-linecap="round"/>
            <path d="M-19 -5 C-17 -16 -8 -22 -1 -20 M5 -22 C16 -22 22 -14 22 -7 M-15 13 C-8 22 2 23 9 19" fill="none" stroke="#fff0f8" stroke-width="1.45" stroke-linecap="round" opacity=".9"/>

<script>
(()=>{
 const $=id=>document.getElementById(id);
 const intro=$('intro'), hold=$('holdControl'), garden=$('garden'), bouquet=$('bouquet');
 let entered=false,opened=false,holdTimer=null,holdStarted=false,letterOpenTimer=null,envelopeRevealTimer=null,bouquetCompleteTimer=null;
 // Fill the sky and foreground with small points of light and individually swaying grass blades.
 const stars=$('stars');
 for(let i=0;i<115;i++){
   const s=document.createElement('i');s.className='star';
   s.style.left=(Math.random()*100)+'%';s.style.top=(Math.random()*67)+'%';
   const size=Math.random()<.16?3:1+Math.random()*1.2;s.style.width=size+'px';s.style.height=size+'px';
   s.style.setProperty('--duration',(1.5+Math.random()*4)+'s');s.style.setProperty('--delay',(-Math.random()*5)+'s');s.style.setProperty('--alpha',(0.35+Math.random()*.65).toFixed(2));stars.appendChild(s);
 }
 const fireflies=$('fireflies');
 for(let i=0;i<23;i++){
   const f=document.createElement('i');f.className='firefly';f.style.left=(Math.random()*100)+'%';f.style.top=(57+Math.random()*40)+'%';f.style.setProperty('--delay',(-Math.random()*4)+'s');fireflies.appendChild(f);
 }
 const grass=$('grassSvg');
 for(let i=0;i<118;i++){
   const x=Math.random()*510,y=105+Math.random()*160,h=28+Math.random()*115,lean=(Math.random()-.5)*35;
   const path=document.createElementNS('http://www.w3.org/2000/svg','path');
   path.setAttribute('d',`M ${x.toFixed(1)} 260 Q ${(x+lean*0.25).toFixed(1)} ${(260-h*.55).toFixed(1)} ${(x+lean).toFixed(1)} ${(260-h).toFixed(1)}`);
   path.setAttribute('fill','none');path.setAttribute('stroke',i%4===0?'#5e9f83':i%4===1?'#244d45':i%4===2?'#a4c79b':'#366c59');path.setAttribute('stroke-width',(0.6+Math.random()*1.6).toFixed(1));path.setAttribute('stroke-linecap','round');path.setAttribute('opacity',(0.2+Math.random()*.55).toFixed(2));path.classList.add('grass-blade');path.style.setProperty('--sway',(2.4+Math.random()*4.8)+'s');path.style.setProperty('--delay',(-Math.random()*5)+'s');grass.appendChild(path);
 }
 function enterGarden(){
   if(entered)return;entered=true;clearTimeout(holdTimer);intro.classList.add('exit');garden.classList.add('active');
   setTimeout(()=>{
     bouquet.classList.add('ready');$('cats').classList.add('show');$('tapHint').classList.add('show');
     // Let stems, leaves, rose heads, wrapping paper and ribbon finish first.
     // The envelope is deliberately the final element to appear.
     clearTimeout(envelopeRevealTimer);clearTimeout(bouquetCompleteTimer);
     envelopeRevealTimer=setTimeout(()=>bouquet.classList.add('envelope-ready'),5700);
     bouquetCompleteTimer=setTimeout(()=>bouquet.classList.add('bouquet-complete'),6450);
   },800);
 }
 function startHold(e){if(entered)return;holdStarted=true;hold.classList.add('holding');holdTimer=setTimeout(enterGarden,780);}
 function cancelHold(){if(entered)return;clearTimeout(holdTimer);hold.classList.remove('holding');holdStarted=false;}
 hold.addEventListener('pointerdown',e=>{e.preventDefault();startHold(e)});
 hold.addEventListener('pointerup',cancelHold);hold.addEventListener('pointercancel',cancelHold);hold.addEventListener('pointerleave',cancelHold);
 hold.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();enterGarden()}});
 const letterText = [
   'Nhân ngày 20/10 - ngày của những người phụ nữ tuyệt vời nhất, anh muốn gửi đến em những lời chúc ấm áp và chân thành nhất. Mong rằng mỗi ngày của em đều ngập tràn niềm vui, tiếng cười và những điều dịu dàng.',
   'Từ khi quen biết em, mọi ngày của anh dường như đều ý nghĩa hơn. Anh mong em luôn được yêu thương, trân trọng và có đủ can đảm để theo đuổi những điều mình mong muốn. Dù bận rộn đến đâu, cũng nhớ dành một chút dịu dàng cho chính mình nhé.',
   'Chúc em luôn xinh đẹp, bình an, tâm hồn lúc nào cũng rạng rỡ. Cảm ơn em vì đã là một cô gái thật đặc biệt.'
 ];
 let typingTimer=null;
 function typeLetter(){
   clearTimeout(typingTimer);
   const body=$('letterBody'), sign=$('letterSign'), next=$('letterNext');
   body.textContent='';sign.textContent='Một món quà nhỏ từ anh ♡';sign.classList.remove('show');next.classList.remove('show');
   const caret=document.createElement('span');caret.className='caret';caret.setAttribute('aria-hidden','true');body.appendChild(caret);
   let p=0,c=0;
   const tick=()=>{
     if(!opened || !$('letterOverlay').classList.contains('visible'))return;
     if(p>=letterText.length){caret.remove();sign.classList.add('show');next.classList.add('show');return;}
     const para=letterText[p];
     if(c<para.length){body.insertBefore(document.createTextNode(para[c]),caret);c++;const card=$('letterCard');if(card.scrollHeight>card.clientHeight)card.scrollTop=card.scrollHeight;const lastChar=para[c-1];const pause='.!?…'.includes(lastChar)?260:',;:'.includes(lastChar)?155:42;typingTimer=setTimeout(tick,pause);}
     else {p++;c=0;if(p<letterText.length){body.insertBefore(document.createElement('br'),caret);body.insertBefore(document.createElement('br'),caret);typingTimer=setTimeout(tick,760);}else{typingTimer=setTimeout(tick,250);}}
   };
   typingTimer=setTimeout(tick,750);
 }
 function openLetter(){
   if(!entered||opened)return;opened=true;clearTimeout(letterOpenTimer);bouquet.classList.add('opened','envelope-hidden');$('app').classList.add('letter-open');$('cats').classList.add('show');
   letterOpenTimer=setTimeout(()=>{if(!opened)return;const overlay=$('letterOverlay');overlay.classList.add('visible');overlay.setAttribute('aria-hidden','false');typeLetter();},680);
 }
 bouquet.addEventListener('click',openLetter);
 function closeLetter(){clearTimeout(typingTimer);clearTimeout(letterOpenTimer);const overlay=$('letterOverlay');overlay.classList.remove('visible');overlay.setAttribute('aria-hidden','true');opened=false;bouquet.classList.remove('envelope-hidden');$('app').classList.remove('letter-open');}
 $('closeLetter').addEventListener('click',closeLetter);
 $('letterNext').addEventListener('click',()=>{if(!opened)return;clearTimeout(typingTimer);$('letterBody').textContent='Một lời chúc nữa dành riêng cho em: mong những điều tốt đẹp sẽ nhẹ nhàng tìm đến, đúng lúc và thật lâu bền. Chúc em luôn hạnh phúc với những gì em lựa chọn.';$('letterSign').textContent='Thương mến ♡';$('letterSign').classList.add('show');$('letterNext').classList.remove('show');});
 $('letterOverlay').addEventListener('click',e=>{if(e.target===$('letterOverlay')||e.target.classList.contains('letter-shade'))closeLetter()});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('letterOverlay').classList.contains('visible'))closeLetter()});
})();
